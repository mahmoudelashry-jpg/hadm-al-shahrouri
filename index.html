<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هدم الخطاب الشحروري من خلال تفكيك أصوله الثلاثة</title>
<meta name="description" content="هدم الخطاب الشحروري من خلال تفكيك أصوله الثلاثة — تأليف فخر الدين حمزة بن سليمان الكهرمان آبادي.">
<meta name="theme-color" content="#14110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/viewer.css">
<style>
main{max-width:760px;margin:0 auto;padding:6px 16px 50px;display:grid;gap:16px}
.card{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none}
.card img{width:130px;aspect-ratio:842/595;object-fit:cover;border-radius:3px;flex:none;background:#fffdf8}
.card .ph{width:130px;aspect-ratio:842/595;border-radius:3px;flex:none;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.card b{display:block;color:var(--gold);font-weight:400;font-size:15px}
.card span{display:block;font-size:clamp(19px,5vw,23px);font-weight:700}
.card small{color:var(--muted);font-size:14px}
.card.soon{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<header class="top">
  <div class="kicker">سلسلة في ثلاثة أجزاء</div>
  <div class="orn"></div>
  <h1>هدم الخطاب الشحروري</h1>
  <div class="sub">من خلال تفكيك أصوله الثلاثة</div>
  <div class="by">تأليف: فخر الدين حمزة بن سليمان الكهرمان آبادي</div>
</header>
<main>
  <a class="card" href="part1/">
    <img src="part1/cover.jpg" alt="غلاف الجزء الأول">
    <div><b>الجزء الأول</b><span>تحريفه للقرآن</span><small>اقرأ الآن ←</small></div>
  </a>
  <a class="card" href="part2/">
    <img src="part2/cover.jpg" alt="غلاف الجزء الثاني">
    <div><b>الجزء الثاني</b><span>إهداره للسنة</span><small>اقرأ الآن ←</small></div>
  </a>
  <a class="card" href="part3/">
    <img src="part3/cover.jpg" alt="غلاف الجزء الثالث">
    <div><b>الجزء الثالث</b><span>علمنته للدين</span><small>اقرأ الآن ←</small></div>
  </a>
</main>
</body>
</html>
